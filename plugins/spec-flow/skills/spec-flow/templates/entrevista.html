<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrevista de requisitos</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5f2;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#7b7a75;--line:#e3e2dd;--track:#e8e7e3;
--blue:#2a78d6;--blue-soft:#e3effc;--good:#0ca30c;--warn:#fab219;--warn-soft:#fff4d6;--crit:#d03b3b}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#97968f;--line:#2e2e2b;--track:#383835;
--blue:#3987e5;--blue-soft:#17304d;--warn-soft:#3a3016}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px 8px}
h1{margin:0;font-size:1.05rem;line-height:1.25}
.cnt{display:flex;justify-content:space-between;gap:8px;color:var(--ink2);font-size:.85rem;margin-top:2px}
.bar{display:flex;gap:2px;height:8px;background:var(--track);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%}.bar .a{background:var(--blue)}.bar .b{background:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:.85rem;min-height:36px;cursor:pointer}
.chip[aria-current=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip .n{opacity:.8;margin-left:4px}.chip.done:not([aria-current=true]){color:var(--ink)}
main{max-width:720px;margin:0 auto;padding:14px 12px 120px}
.aviso{background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.ok{border-left-color:var(--blue)}.card.byp{border-left-color:var(--warn)}.card.wait{border-left-color:#6250d6}.card.rev{border-left-color:#ec835a}.espera.rev{background:#fdeee6}@media (prefers-color-scheme:dark){.espera.rev{background:#3b2417}}
.bar .w{background:#6250d6}
.btn.dir[aria-pressed=true]{border-color:#6250d6;color:#6250d6;font-weight:600}.btn.dir small{opacity:.75}
.dirbox{margin-top:10px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px}.dirbox label{display:block;font-size:.82rem;color:var(--ink2);margin:6px 0 2px}.dirbox textarea{margin-top:0;min-height:70px}
.pin{color:#6250d6;font-weight:600}.sugtxt{font-size:.88rem;background:#efecfb;border-radius:10px;padding:8px 10px;margin:8px 0 0}@media (prefers-color-scheme:dark){.sugtxt{background:#2a2447}.pin{color:#9085e9}}
.chip.pinchip{border-color:#6250d6;color:#6250d6}.chip.pinchip[aria-pressed=true]{background:#6250d6;border-color:#6250d6;color:#fff}.btn.dirq{border-color:#6250d6;color:#6250d6;font-weight:600}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--ink2);margin:8px 0}.chk input{margin-top:3px}
.espera{font-size:.88rem;background:#efecfb;border-radius:10px;padding:8px 10px;margin:10px 0 0}@media (prefers-color-scheme:dark){.espera{background:#2a2447}}
.tag{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag b{font-weight:600;color:var(--ink2)}
.q{font-size:1.05rem;font-weight:650;margin:4px 0 2px}
.why{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.dica{font-size:.85rem;background:var(--blue-soft);border-radius:10px;padding:8px 10px;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px;min-height:48px;font:inherit;cursor:pointer}
.opt:active{transform:scale(.995)}
.opt .mk{flex:0 0 22px;height:22px;border:2px solid var(--muted);border-radius:50%;margin-top:1px;display:grid;place-items:center;font-size:.8rem;color:#fff}
.opt.multi .mk{border-radius:6px}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft)}
.opt[aria-pressed=true] .mk{background:var(--blue);border-color:var(--blue)}
.opt small{display:block;color:var(--muted);font-size:.8rem}
.rec{font-size:.7rem;background:var(--good);color:#fff;border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap;vertical-align:middle}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:10px;padding:9px 14px;font:inherit;font-size:.9rem;min-height:44px;cursor:pointer}
.btn[aria-pressed=true]{border-color:var(--blue);color:var(--blue);font-weight:600}
.btn.pular[aria-pressed=true]{border-color:var(--warn);color:var(--ink);background:var(--warn-soft)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
textarea{width:100%;min-height:92px;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.st{font-size:.78rem;color:var(--muted);margin-top:8px;min-height:1.1em}.st.ok{color:var(--good)}.st.err{color:var(--crit)}
.fim{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:6}
.fim .btn{flex:1;max-width:340px}
.vazio{text-align:center;color:var(--muted);padding:40px 10px}
</style>
</head>
<body>
<header>
  <h1 id="titulo">Entrevista de requisitos</h1>
  <div class="cnt"><span id="c1"></span><span id="c2"></span></div>
  <div class="bar" id="barra"></div>
  <nav class="chips" id="chips" aria-label="Blocos"></nav>
</header>
<main id="main"></main>
<div class="fim" id="fim"></div>
<script>
const D = /*__DADOS__*/null;
(function(){
"use strict";
if(!D){document.getElementById("main").innerHTML='<div class="vazio">Sem dados da entrevista.</div>';return;}
const $=s=>document.querySelector(s);
const ags=D.perguntas, blocos=D.blocos;
let resp=Object.assign({},D.respostas||{});
const cli={};ags.forEach(q=>{if(q.cliente&&q.cliente.ativa)cli[q.id]=q.cliente;});
let filtroSug=false, blocoAtual=null, db=null, dict=null, conectado=false, aviso="";
const LS="specflow:"+D.projeto;
try{const x=JSON.parse(localStorage.getItem(LS)||"{}"),R=x.r||(x.c?{}:x),C=x.c||{};
  for(const k in R){if(!resp[k]||(R[k].em||"")>(resp[k].em||""))resp[k]=R[k];}
  for(const k in C){if(!cli[k]||(C[k].em||"")>(cli[k].em||""))cli[k]=C[k];}}catch(e){}
const agora=()=>new Date().toISOString().replace(/\.\d+Z$/,"Z");
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function textoResp(q){const r=resp[q.id];if(!r)return"";if(r.tipo==="opcao")return(r.indices||[]).map(i=>q.o[i-1]?q.o[i-1][0]:"").join("; ")+" "+(r.texto||"");if(r.tipo==="livre")return r.texto||"";return"";}
function visivel(q){if(!q.se)return true;const ref=ags.find(x=>x.id===q.se[0]);if(!ref||!resp[ref.id]||resp[ref.id].tipo==="bypass")return false;return textoResp(ref).toLowerCase().includes(q.se[1].toLowerCase());}
const vis=()=>ags.filter(visivel);
const selecionada=q=>q.selecao_cliente==="sugerida"&&!(cli[q.id]&&cli[q.id].ativa)&&est(q)!=="r";
const est=q=>{const r=resp[q.id];if(r&&q.revisao&&q.revisao.aberta&&(r.em||"")<=(q.revisao.em||""))return"v";return!r?(cli[q.id]&&cli[q.id].ativa?"w":"p"):r.tipo==="bypass"?"b":"r";};

/* ---------- salvar ---------- */
const filas={}, timers={};
function guardarLocal(){try{localStorage.setItem(LS,JSON.stringify({r:resp,c:cli}));}catch(e){}}
const stMap={};
function setSt(id,txt,cls){stMap[id]=[txt,cls||""];const el=document.querySelector('[data-st="'+id+'"]');if(el){el.textContent=txt;el.className="st "+(cls||"");}}
function enviar(id,doc){
  if(!db){setSt(id,"Guardado só neste aparelho","");return;}
  setSt(id,"Salvando…","");
  filas[id]=(filas[id]||Promise.resolve()).then(()=>db.doc("answers/"+id).set(doc)).then(()=>setSt(id,"✓ Salvo","ok"),
    e=>setSt(id,"Não salvou na nuvem ("+(e&&e.code||"erro")+"). Fica neste aparelho.","err"));
}
function direcionar(q,txt,ops,arq){delete resp[q.id];const em=agora();cli[q.id]={ativa:true,texto:txt,opcoes:ops,em,arquivo:!!arq};q._dir=false;guardarLocal();
  enviar(q.id,{tipo:"cliente",texto:txt,opcoes:ops,em,arquivo:!!arq});renderTudo(q.id);}
function desdirecionar(q){const em=agora();cli[q.id]={ativa:false,em};q._dir=false;guardarLocal();enviar(q.id,{tipo:"cliente",ativa:false,em});renderTudo(q.id);}
function gravar(id,dado,imediato){
  resp[id]=dado;guardarLocal();renderTudo(id);
  const run=()=>enviar(id,resp[id]);
  clearTimeout(timers[id]);
  if(imediato)run();else timers[id]=setTimeout(run,700);
}
function escolher(q,n){
  const atual=resp[q.id];let idx=[];
  if(q.multi){idx=atual&&atual.tipo==="opcao"?atual.indices.slice():[];const p=idx.indexOf(n);if(p>=0)idx.splice(p,1);else idx.push(n);idx.sort((a,b)=>a-b);
    if(!idx.length){delete resp[q.id];guardarLocal();renderTudo(q.id);return;}}
  else idx=[n];
  gravar(q.id,{tipo:"opcao",indices:idx,texto:(atual&&atual.tipo==="opcao"?atual.texto:"")||"",em:agora()},true);
}
function pular(q){const a=resp[q.id];if(a&&a.tipo==="bypass"){delete resp[q.id];guardarLocal();renderTudo(q.id);return;}
  gravar(q.id,{tipo:"bypass",texto:"",em:agora()},true);}

/* ---------- render ---------- */
function contagem(){const v=vis();let r=0,b=0,w=0,x=0;v.forEach(q=>{const e=est(q);if(e==="r")r++;else if(e==="b")b++;else if(e==="w")w++;else if(e==="v")x++;});return{t:v.length,r,b,w,x,p:v.length-r-b-w-x};}
function cabecalho(){
  const c=contagem();$("#titulo").textContent=D.projeto;
  $("#c1").textContent=c.r+" de "+c.t+" respondidas"+(c.b?" · "+c.b+" puladas":"")+(c.w?" · "+c.w+" com o cliente":"")+(c.x?" · "+c.x+" a revisar":"");
  $("#c2").textContent=c.p?c.p+" pendentes":c.x?"revise as decisões marcadas":c.w?"falta só o cliente":"tudo resolvido ✓";
  $("#barra").innerHTML='<i class="a" style="width:'+(100*c.r/(c.t||1))+'%"></i><i class="w" style="width:'+(100*c.w/(c.t||1))+'%"></i><i class="b" style="width:'+(100*c.b/(c.t||1))+'%"></i>';
  const v=vis();const bs=blocos.filter(b=>v.some(q=>q.bloco===b.id));
  if(!bs.some(b=>b.id===blocoAtual))blocoAtual=(bs.find(b=>v.some(q=>q.bloco===b.id&&est(q)==="p"))||bs[0]||{}).id;
  const nsug=v.filter(selecionada).length;
  $("#chips").innerHTML=((nsug||filtroSug)?'<button class="chip pinchip" data-pin="1" aria-pressed="'+filtroSug+'">📌 Sugeridas p/ cliente<span class="n">'+nsug+'</span></button>':"")+bs.map(b=>{const qs=v.filter(q=>q.bloco===b.id);const ok=qs.filter(q=>est(q)!=="p"&&est(q)!=="v").length;
    return '<button class="chip'+(ok===qs.length?" done":"")+'" data-b="'+b.id+'" aria-current="'+(!filtroSug&&b.id===blocoAtual)+'">'+esc(b.nome)+'<span class="n">'+ok+'/'+qs.length+'</span></button>';}).join("");
}
function card(q,pos,total){
  const r=resp[q.id],e=est(q);
  const ops=q.o.map((o,i)=>{const n=i+1,sel=r&&r.tipo==="opcao"&&r.indices.includes(n);
    return '<button class="opt'+(q.multi?" multi":"")+'" data-q="'+q.id+'" data-n="'+n+'" aria-pressed="'+!!sel+'"><span class="mk">'+(sel?"✓":"")+'</span><span>'+esc(o[0])+
      (i===0?'<span class="rec">Recomendada</span>':"")+(o[1]?'<small>'+esc(o[1])+'</small>':"")+'</span></button>';}).join("");
  const livre=r&&(r.tipo==="livre"||(r.tipo==="opcao"&&r.texto))||(r&&r.tipo==="bypass"&&r.texto);
  const abrirTxt=(r&&r.tipo==="livre")||q._abrir;
  const cl=cli[q.id],neg=q.neg||{};
  const sel=selecionada(q);
  const quick=(neg.q&&e!=="r"&&!(cl&&cl.ativa))?'<button class="btn dirq" data-dirq="'+q.id+'">Enviar ao cliente (texto sugerido)</button>':"";
  const sugtxt=sel?'<p class="sugtxt">📌 Sugeri esta para o cliente. Texto pronto: “'+esc(neg.q)+'”</p>':"";
  const dirBtn=e!=="r"?'<button class="btn dir" data-dir="'+q.id+'" aria-pressed="'+(e==="w"||!!q._dir)+'">Direcionar ao dono do negócio'+(neg.q&&!(cl&&cl.ativa)?' <small>(sugestão pronta)</small>':'')+'</button>':"";
  const painel=(q._dir&&e!=="r")?'<div class="dirbox"><label>Pergunta que o dono do negócio vai ver (linguagem de negócio; pode editar)</label><textarea data-dtxt="'+q.id+'">'+esc((cl&&cl.ativa&&cl.texto)||neg.q||"")+'</textarea>'+
    '<label>Opções de resposta para ele, uma por linha (opcional)</label><textarea data-dopt="'+q.id+'">'+esc(((cl&&cl.ativa&&cl.opcoes)||neg.o||[]).join("\n"))+'</textarea>'+
    '<label class="chk"><input type="checkbox" data-darq="'+q.id+'"'+((cl&&cl.arquivo)?" checked":"")+'> O cliente precisa enviar um arquivo (máx. 8 MB; maior que isso o desenvolvedor pega depois)</label>'+(q.design?'<p class="espera">🎨 Pergunta de design: ao gerar a página do cliente, o Claude acrescenta opções visuais e links de referência.</p>':"")+'<div class="acts"><button class="btn pri" data-dir-ok="'+q.id+'">'+(e==="w"?"Atualizar pergunta":"Enviar ao cliente")+'</button>'+(e==="w"?'<button class="btn" data-dir-rm="'+q.id+'">Não direcionar mais</button>':"")+'</div></div>':"";
  const espera=e==="w"?'<p class="espera">⏳ Direcionada ao dono do negócio: “'+esc(cl.texto)+'”</p>'+(q.resposta_cliente?'<p class="dica">✎ Cliente respondeu: '+esc(((q.resposta_cliente.opcao||"")+" "+(q.resposta_cliente.texto||"")).trim())+' <b>Traduza com o Claude para virar decisão.</b></p>':""):"";
  const mic=dict?'<button class="btn" data-mic="'+q.id+'" type="button">🎤 Ditar</button>':"";
  return '<section class="card '+(e==="r"?"ok":e==="b"?"byp":e==="w"?"wait":e==="v"?"rev":"")+'" id="q-'+q.id+'" data-card="'+q.id+'">'+
    '<div class="tag"><b>Pergunta '+pos+' de '+total+'</b><span>'+esc(q.id)+'</span>'+(q.origem==="escopo"?'<span>· do escopo</span>':"")+(sel?'<span class="pin">· 📌 sugerida para o cliente</span>':"")+(q.multi?'<span>· pode marcar várias</span>':"")+'</div>'+
    '<div class="q">'+esc(q.q)+'</div><p class="why">'+esc(q.why||"")+(q.motivo?' <i>(surgiu de: '+esc(q.motivo)+')</i>':"")+'</p>'+(q.dica?'<p class="dica">📎 No briefing: '+esc(q.dica)+' <b>Confirme ou corrija.</b></p>':"")+
    (e==="v"?'<p class="espera rev">↻ <b>Revisar:</b> '+esc(q.revisao.motivo||"")+(q.revisao.origem?" (origem "+esc(q.revisao.origem)+")":"")+'<br><small>Decisão anterior: '+esc(q.revisao.decisao_anterior||"")+'</small></p>':"")+sugtxt+espera+'<div class="opts">'+ops+'</div>'+
    '<div class="acts"><button class="btn" data-outra="'+q.id+'" aria-pressed="'+!!abrirTxt+'">Outra resposta</button>'+mic+
    quick+dirBtn+'<button class="btn pular" data-pular="'+q.id+'" aria-pressed="'+(e==="b")+'">Pular (decidir depois)</button></div>'+painel+
    (abrirTxt||livre||e==="b"?'<textarea data-txt="'+q.id+'" placeholder="'+(e==="b"?"Motivo ou risco de deixar para depois (opcional)":"Escreva a sua resposta")+'">'+esc(r?(r.texto||""):"")+'</textarea>':"")+
    '<div class="st '+(stMap[q.id]?stMap[q.id][1]:"")+'" data-st="'+q.id+'">'+esc(stMap[q.id]?stMap[q.id][0]:"")+'</div></section>';
}
function digitando(el){const a=document.activeElement;return!!(a&&a.tagName==="TEXTAREA"&&el&&el.contains(a));}
function renderBloco(){
  const v=vis(),qs=filtroSug?v.filter(selecionada):v.filter(q=>q.bloco===blocoAtual);
  const main=$("#main");
  if(digitando(main))return; /* não derruba quem está digitando */
  main.innerHTML=(aviso?'<div class="aviso">'+aviso+'</div>':"")+(qs.length?qs.map(q=>card(q,v.indexOf(q)+1,v.length)).join(""):'<div class="vazio">'+(filtroSug?"Nenhuma sugerida pendente. ✓":"Nenhuma pergunta neste bloco.")+'</div>');
}
function rodape(){
  const c=contagem();
  $("#fim").innerHTML=(c.p||c.x)?'<button class="btn pri" data-prox="1">Próxima pendente ↓</button>':
    '<button class="btn pri" data-copiar="1">'+(c.w?"Falta só o cliente · ":"Tudo respondido · ")+(conectado?'volte ao Claude Code e diga “retomar”':'Copiar respostas')+'</button>';
}
function renderTudo(qid){cabecalho();
  const el=qid&&document.querySelector('[data-card="'+qid+'"]');
  if(el&&!digitando(el)){const v=vis(),q=ags.find(x=>x.id===qid);
    if(q&&visivel(q)&&!filtroSug&&q.bloco===blocoAtual){const t=document.createElement("div");t.innerHTML=card(q,v.indexOf(q)+1,v.length);el.replaceWith(t.firstChild);}else renderBloco();}
  else if(!el)renderBloco();
  rodape();}

/* ---------- eventos ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button");if(!t)return;
  if(t.dataset.pin){filtroSug=!filtroSug;cabecalho();renderBloco();window.scrollTo({top:0});return;}
  if(t.dataset.dirq){const q=ags.find(x=>x.id===t.dataset.dirq);direcionar(q,q.neg.q,q.neg.o||[],false);if(filtroSug){cabecalho();renderBloco();}return;}
  if(t.dataset.b){filtroSug=false;blocoAtual=t.dataset.b;cabecalho();renderBloco();window.scrollTo({top:0});return;}
  if(t.dataset.n){const q=ags.find(x=>x.id===t.dataset.q);escolher(q,+t.dataset.n);return;}
  if(t.dataset.pular){pular(ags.find(x=>x.id===t.dataset.pular));return;}
  if(t.dataset.outra){const q=ags.find(x=>x.id===t.dataset.outra);q._abrir=true;
    const c=document.querySelector('[data-card="'+q.id+'"]');if(c&&!c.querySelector("textarea")){const ta=document.createElement("textarea");ta.dataset.txt=q.id;ta.placeholder="Escreva a sua resposta";c.querySelector(".st").before(ta);ta.focus();}else if(c)c.querySelector("textarea").focus();return;}
  if(t.dataset.mic){iniciarDitado(t.dataset.mic,t);return;}
  if(t.dataset.prox){const v=vis();const p=v.find(q=>est(q)==="v")||v.find(q=>est(q)==="p");if(!p)return;blocoAtual=p.bloco;cabecalho();renderBloco();
    const el=document.querySelector('[data-card="'+p.id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(t.dataset.dir){const q=ags.find(x=>x.id===t.dataset.dir);q._dir=!q._dir;renderTudo(q.id);return;}
  if(t.dataset.dirOk){const q=ags.find(x=>x.id===t.dataset.dirOk),c=document.querySelector('[data-card="'+q.id+'"]');
    const txt=c.querySelector("[data-dtxt]").value.trim();if(!txt){setSt(q.id,"Escreva a pergunta para o cliente","err");return;}
    direcionar(q,txt,c.querySelector("[data-dopt]").value.split("\n").map(x=>x.trim()).filter(Boolean),c.querySelector("[data-darq]").checked);return;}
  if(t.dataset.dirRm){desdirecionar(ags.find(x=>x.id===t.dataset.dirRm));return;}
  if(t.dataset.copiar){copiar(t);}
});
document.addEventListener("input",ev=>{
  const ta=ev.target.closest("textarea[data-txt]");if(!ta)return;
  const q=ags.find(x=>x.id===ta.dataset.txt),r=resp[q.id],txt=ta.value;
  let d;
  if(r&&r.tipo==="opcao")d={tipo:"opcao",indices:r.indices,texto:txt,em:agora()};
  else if(r&&r.tipo==="bypass")d={tipo:"bypass",texto:txt,em:agora()};
  else if(txt.trim())d={tipo:"livre",texto:txt,em:agora()};
  else{delete resp[q.id];guardarLocal();cabecalho();rodape();return;}
  resp[q.id]=d;guardarLocal();cabecalho();rodape();setSt(q.id,"Digitando…","");gravar.call(null,q.id,d,false);
});
document.addEventListener("focusout",ev=>{if(ev.target.matches&&ev.target.matches("textarea[data-txt]")){const id=ev.target.dataset.txt;
  if(timers[id]){clearTimeout(timers[id]);gravar(id,resp[id]||{tipo:"livre",texto:ev.target.value,em:agora()},true);}}});

function copiar(btn){
  const all=Object.assign({},resp);for(const k in cli){if(!all[k])all[k]=Object.assign({tipo:"cliente"},cli[k]);}
  const out={answers:all};const s=JSON.stringify(out);
  (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(s):Promise.reject()).then(()=>{btn.textContent="Copiado ✓";},
    ()=>{const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");btn.textContent="Copiado ✓";}catch(e){btn.textContent="Não consegui copiar";}ta.remove();});
}
function iniciarDitado(id,btn){
  const ta=document.querySelector('[data-txt="'+id+'"]')||(function(){const q=ags.find(x=>x.id===id);q._abrir=true;renderBloco();return document.querySelector('[data-txt="'+id+'"]');})();
  if(!dict||!ta)return;
  if(dict.active()){dict.stop();return;}
  const off=[];
  off.push(dict.onFinal(({text})=>{ta.value=(ta.value+text).replace(/^\s+/,"");ta.dispatchEvent(new Event("input",{bubbles:true}));}));
  off.push(dict.onState(({state})=>{btn.textContent=state==="listening"?"■ Parar":"🎤 Ditar";if(state==="idle")off.forEach(f=>f());}));
  dict.start().catch(()=>{btn.textContent="🎤 Ditar";});
}

/* ---------- nuvem (opcional) ---------- */
function mesclar(id,d){if(!d||!ags.some(q=>q.id===id))return false;
  if(d.tipo==="cliente"){const c=cli[id];if(c&&(c.em||"")>=(d.em||""))return false;cli[id]={ativa:d.ativa!==false,texto:d.texto||"",opcoes:d.opcoes||[],em:d.em};return true;}
  const a=resp[id];if(a&&(a.em||"")>=(d.em||""))return false;resp[id]=d;return true;}
async function iniciarNuvem(){
  if(!(window.claude&&window.claude.use)){aviso="Sem salvamento na nuvem nesta tela: as respostas ficam só neste aparelho. No fim, toque em <b>Copiar respostas</b> e cole no Claude Code.";renderTudo();return;}
  try{db=await window.claude.use("db");}catch(e){db=null;}
  try{dict=await window.claude.use("dictation");}catch(e){dict=null;}
  if(!db){aviso="Sem salvamento na nuvem nesta tela: as respostas ficam só neste aparelho. No fim, toque em <b>Copiar respostas</b> e cole no Claude Code.";renderTudo();return;}
  const limite=setTimeout(()=>{aviso="Ainda não consegui falar com o salvamento. Suas respostas continuam neste aparelho e serão enviadas assim que conectar.";renderBloco();},10000);
  db.collection("answers").onSnapshot(snap=>{
    clearTimeout(limite);let mudou=false;
    snap.docs.forEach(d=>{if(d.exists&&mesclar(d.id,d.data()))mudou=true;});
    if(!snap.metadata.fromCache){conectado=true;aviso="";
      /* reenvia o que só existe aqui (ex.: respondido sem conexão) */
      const nuvem={};snap.docs.forEach(d=>{nuvem[d.id]=d.data();});
      ags.forEach(q=>{const l=resp[q.id];if(l&&(!nuvem[q.id]||(nuvem[q.id].em||"")<(l.em||"")))gravar(q.id,l,true);
        else if(!l&&cli[q.id]&&cli[q.id].texto&&(!nuvem[q.id]||(nuvem[q.id].em||"")<(cli[q.id].em||"")))enviar(q.id,Object.assign({tipo:"cliente"},cli[q.id]));});}
    guardarLocal();cabecalho();renderBloco();rodape();
  },err=>{clearTimeout(limite);aviso="O salvamento na nuvem parou ("+(err&&err.code||"erro")+"). Suas respostas ficam neste aparelho.";renderBloco();});
  renderTudo();
}
cabecalho();renderBloco();rodape();iniciarNuvem();
})();
